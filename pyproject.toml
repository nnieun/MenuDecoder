[project]
name = "menudecoder"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.1",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "openai>=3.10.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.0",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "sudachidict-core>=20260723",
    "sudachipy>=0.6.11",
    "tiktoken>=0.14.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
